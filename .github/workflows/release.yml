name: Release build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0.1.0

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --locked --release

      - name: Hash binary
        shell: pwsh
        run: |
          $f = "target/release/printcad.exe"
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          "$h  printcad.exe" | Out-File -Encoding ascii SHA256SUMS.txt

      - name: Upload to v0.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0 target/release/printcad.exe SHA256SUMS.txt --clobber
